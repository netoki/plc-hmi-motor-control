<svg xmlns="http://www.w3.org/2000/svg" width="640" height="650" viewBox="0 0 640 650" font-family="Arial, Helvetica, sans-serif">
  <rect width="640" height="650" fill="#fff"/>

  <g stroke="#000" stroke-width="1.5" fill="none">
    <!-- U1 Arduino -->
    <rect x="40" y="50" width="150" height="420" fill="#fff"/>
    <!-- U2 L293D -->
    <rect x="330" y="110" width="170" height="285" fill="#fff"/>
    <!-- left pin stubs -->
    <line x1="315" y1="130" x2="330" y2="130"/><line x1="315" y1="165" x2="330" y2="165"/>
    <line x1="315" y1="200" x2="330" y2="200"/><line x1="300" y1="235" x2="330" y2="235"/>
    <line x1="315" y1="270" x2="330" y2="270"/><line x1="315" y1="305" x2="330" y2="305"/>
    <line x1="315" y1="340" x2="330" y2="340"/><line x1="315" y1="375" x2="330" y2="375"/>
    <!-- right pin stubs -->
    <line x1="500" y1="130" x2="515" y2="130"/><line x1="500" y1="165" x2="515" y2="165"/>
    <line x1="500" y1="200" x2="515" y2="200"/><line x1="500" y1="235" x2="515" y2="235"/>
    <line x1="500" y1="270" x2="515" y2="270"/><line x1="500" y1="305" x2="515" y2="305"/>
    <line x1="500" y1="340" x2="515" y2="340"/><line x1="500" y1="375" x2="515" y2="375"/>

    <!-- +5V_LOGIC: U1 5V to U2 pin 16 -->
    <polyline points="190,70 545,70 545,130 515,130"/>
    <!-- Signals -->
    <line x1="190" y1="130" x2="315" y2="130"/>
    <line x1="190" y1="165" x2="315" y2="165"/>
    <line x1="190" y1="340" x2="315" y2="340"/>
    <!-- M1 -->
    <polyline points="315,200 255,200 255,230"/>
    <polyline points="315,305 255,305 255,274"/>
    <circle cx="255" cy="252" r="22" fill="#fff"/>
    <!-- Pin 4 GND -->
    <line x1="300" y1="235" x2="300" y2="247"/>
    <line x1="292" y1="247" x2="308" y2="247"/><line x1="295" y1="251" x2="305" y2="251"/><line x1="298" y1="255" x2="302" y2="255"/>
    <!-- +5V_MOTOR: pin 8 to PS1 + -->
    <polyline points="315,375 300,375 300,440"/>
    <!-- PS1 -->
    <rect x="220" y="440" width="120" height="60" fill="#fff"/>
    <line x1="240" y1="500" x2="240" y2="512"/>
    <line x1="232" y1="512" x2="248" y2="512"/><line x1="235" y1="516" x2="245" y2="516"/><line x1="238" y1="520" x2="242" y2="520"/>
    <!-- U1 GND -->
    <line x1="190" y1="450" x2="202" y2="450"/>
    <line x1="202" y1="450" x2="202" y2="462"/>
    <line x1="194" y1="462" x2="210" y2="462"/><line x1="197" y1="466" x2="207" y2="466"/><line x1="200" y1="470" x2="204" y2="470"/>
    <!-- No-connect marks on unused pins -->
    <g stroke-width="1.2">
      <path d="M311 266l8 8M319 266l-8 8"/>
      <path d="M511 161l8 8M519 161l-8 8"/><path d="M511 196l8 8M519 196l-8 8"/>
      <path d="M511 231l8 8M519 231l-8 8"/><path d="M511 266l8 8M519 266l-8 8"/>
      <path d="M511 301l8 8M519 301l-8 8"/><path d="M511 336l8 8M519 336l-8 8"/>
      <path d="M511 371l8 8M519 371l-8 8"/>
    </g>
  </g>

  <!-- Designators -->
  <g font-size="12" font-weight="bold" fill="#000">
    <text x="40" y="44">U1</text>
    <text x="330" y="104">U2</text>
    <text x="283" y="230">M1</text>
    <text x="220" y="434">PS1</text>
  </g>

  <!-- U1 labels -->
  <g font-size="12" fill="#000">
    <text x="115" y="245" text-anchor="middle" font-weight="bold">ARDUINO UNO R3</text>
    <text x="115" y="263" text-anchor="middle" font-size="10">USB to PC (COM3)</text>
    <text x="182" y="74" text-anchor="end">5V</text>
    <text x="182" y="134" text-anchor="end">D5~</text>
    <text x="182" y="169" text-anchor="end">D4</text>
    <text x="182" y="344" text-anchor="end">D3~</text>
    <text x="182" y="454" text-anchor="end">GND</text>
  </g>

  <!-- Net names -->
  <g font-size="10" fill="#000">
    <text x="360" y="64">+5V_LOGIC</text>
    <text x="200" y="125">MOTOR_PWM</text>
    <text x="200" y="160">MOTOR_DIR_A</text>
    <text x="200" y="335">MOTOR_DIR_B</text>
    <text x="234" y="390">+5V_MOTOR</text>
  </g>

  <!-- U2 labels -->
  <g font-size="11" fill="#000">
    <text x="415" y="128" text-anchor="middle" font-weight="bold" font-size="12">L293D</text>
    <text x="338" y="144">1 EN1,2</text>
    <text x="338" y="169">2 1A</text>
    <text x="338" y="204">3 1Y</text>
    <text x="338" y="239">4 GND</text>
    <text x="338" y="274">5 GND</text>
    <text x="338" y="309">6 2Y</text>
    <text x="338" y="344">7 2A</text>
    <text x="338" y="379">8 VCC2</text>
    <text x="492" y="144" text-anchor="end">VCC1 16</text>
    <text x="492" y="169" text-anchor="end">4A 15</text>
    <text x="492" y="204" text-anchor="end">4Y 14</text>
    <text x="492" y="239" text-anchor="end">GND 13</text>
    <text x="492" y="274" text-anchor="end">GND 12</text>
    <text x="492" y="309" text-anchor="end">3Y 11</text>
    <text x="492" y="344" text-anchor="end">3A 10</text>
    <text x="492" y="379" text-anchor="end">EN3,4 9</text>
  </g>

  <!-- M1 / PS1 labels -->
  <g font-size="11" fill="#000">
    <text x="255" y="257" text-anchor="middle" font-weight="bold" font-size="13">M</text>
    <text x="226" y="288" text-anchor="end">3–6 V DC</text>
    <text x="280" y="466" text-anchor="middle" font-weight="bold">POWER MODULE</text>
    <text x="280" y="484" text-anchor="middle" font-size="10">5 V OUT</text>
    <text x="306" y="434">+</text>
    <text x="280" y="540" text-anchor="middle" font-size="10">9 V 1 A adapter input</text>
  </g>

  <!-- Notes -->
  <g font-size="10" fill="#000">
    <text x="380" y="440" font-weight="bold">NOTES</text>
    <text x="380" y="458">1. All ground symbols are one common net.</text>
    <text x="380" y="474">2. U2 pins 4, 5, 12, 13 tied internally.</text>
    <text x="380" y="490">3. Motor current supplied by PS1, not USB.</text>
    <text x="380" y="506">4. U2 channel 2 (pins 9–15) not used.</text>
    <text x="380" y="522">5. Swapping D3/D4 reverses direction only.</text>
  </g>

  <!-- Title block -->
  <g stroke="#000" stroke-width="1" fill="none">
    <rect x="40" y="575" width="560" height="50"/>
    <line x1="340" y1="575" x2="340" y2="625"/>
    <line x1="430" y1="575" x2="430" y2="625"/>
    <line x1="520" y1="575" x2="520" y2="625"/>
  </g>
  <g font-size="9" fill="#000">
    <text x="48" y="587">TITLE</text>
    <text x="348" y="587">DRAWN</text>
    <text x="438" y="587">DATE</text>
    <text x="528" y="587">REV / SHEET</text>
  </g>
  <g font-size="11" fill="#000">
    <text x="48" y="610" font-weight="bold">MOTOR DRIVER WIRING SCHEMATIC</text>
    <text x="348" y="610">N. Dang</text>
    <text x="438" y="610">2026-11-08</text>
    <text x="528" y="610">A / 1 of 1</text>
  </g>
</svg>
